<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Multi-Format Block Coder & Script Generator Ultimate</title>
    <!-- Blockly CDN -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #000000;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #2d2d2d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3d3d3d;
            flex-shrink: 0;
            gap: 15px;
            flex-wrap: wrap;
        }
        h1 { margin: 0; font-size: 18px; color: #4ec9b0; }
        .selectors-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .format-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label { font-size: 13px; color: #9cdcfe; font-weight: bold; }
        select {
            background: #252526;
            color: #d4d4d4;
            border: 1px solid #3f3f46;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: #007acc; }
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 53px);
            position: relative;
        }
        #blocklyDiv {
            flex-grow: 1;
            height: 100%;
            position: relative;
        }
        .output-panel {
            width: 420px;
            min-width: 350px;
            background: #252526;
            border-left: 2px solid #3d3d3d;
            display: flex;
            flex-direction: column;
            padding: 15px;
            height: 100%;
        }
        h3 { margin-top: 0; color: #9cdcfe; font-size: 15px; }
        textarea {
            flex: 1;
            background: #1e1e1e;
            color: #ce9178;
            border: 1px solid #3f3f46;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
            border-radius: 4px;
            line-height: 1.4;
            white-space: pre;
        }
        .btn-generate {
            background: #28a745;
            color: white;
            font-size: 15px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .btn-generate:hover { background: #218838; }
        .btn-gui {
            background: #6f42c1;
            color: #ffffff;
            font-size: 14px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .btn-gui:hover { background: #5a32a3; }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #1177bb; }

        /* Modal GUI Editora */
        #guiModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #252526;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            width: 500px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h2 { margin-top: 0; color: #4ec9b0; font-size: 18px; }
        .gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3f3f46;
        }
        .gui-slot {
            aspect-ratio: 1;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            position: relative;
        }
        .gui-slot:hover { border-color: #007acc; background: #333; }
        .gui-slot input {
            position: absolute;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Block Coder & Generator Ultimate</h1>
        <div class="selectors-group">
            <div class="format-selector">
                <label for="mcVersionSelect">Wersja MC:</label>
                <select id="mcVersionSelect">
                    <option value="1.21">1.21 / 1.21.x (Najnowsza)</option>
                    <option value="1.20">1.20 lub starsze</option>
                </select>
            </div>
            <div class="format-selector">
                <label for="formatSelect">Format:</label>
                <select id="formatSelect">
                    <option value="skript">Skript (Minecraft)</option>
                    <option value="js">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="html">HTML</option>
                    <option value="commands">Komendy MC (Vanilla)</option>
                </select>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div id="blocklyDiv"></div>
        
        <div class="output-panel">
            <h3>Wygenerowany Kod:</h3>
            <button class="btn-generate" onclick="updateCode()">⚙️ Generuj Kod</button>
            <button class="btn-gui" onclick="openGuiModal()">🎨 Edytor GUI (Menu)</button>
            <textarea id="outputCode" readonly placeholder="Kliknij 'Generuj Kod', aby przekonwertować klocki..."></textarea>
            <button onclick="copyCode()">Skopiuj do schowka</button>
        </div>
    </div>

    <!-- Modal Edytora GUI -->
    <div id="guiModal">
        <div class="modal-content">
            <h2>Kreator Menu GUI</h2>
            <div>
                <label>Nazwa / Tytuł GUI:</label>
                <input type="text" id="guiTitleInput" value="Sklep Serwera" style="width: 100%; padding: 8px; background: #1e1e1e; color: #fff; border: 1px solid #3f3f46; border-radius: 4px; margin-top: 5px;">
            </div>
            <div>
                <label>Wiersze (Rozmiar):</label>
                <select id="guiRowsSelect" style="width: 100%; margin-top: 5px;" onchange="updateGuiGridSize()">
                    <option value="1">1 wiersz (9 slotów)</option>
                    <option value="2">2 wiersze (18 slotów)</option>
                    <option value="3" selected>3 wiersze (27 slotów)</option>
                    <option value="4">4 wiersze (36 slotów)</option>
                    <option value="5">5 wierszy (45 slotów)</option>
                    <option value="6">6 wierszy (54 sloty)</option>
                </select>
            </div>
            <label>Układ przedmiotów (Kliknij, aby wpisać ID przedmiotu np. diamond):</label>
            <div class="gui-grid" id="guiGridContainer">
                <!-- Generowane dynamicznie -->
            </div>
            <div class="modal-buttons">
                <button style="background: #555;" onclick="closeGuiModal()">Zamknij</button>
                <button style="background: #28a745;" onclick="saveGuiConfig()">Zapisz GUI</button>
            </div>
        </div>
    </div>

    <!-- Definicje Toolboxa (Wszystkie opcje) -->
    <xml id="toolbox" style="display: none">
        <category name="Zdarzenia" colour="#e2a14a">
            <block type="on_event"></block>
            <block type="on_command"></block>
        </category>
        <category name="Czynności i Logika" colour="#b83ba8">
            <block type="do_action"></block>
            <block type="if_then_action"></block>
            <block type="if_else_action"></block>
            <block type="if_statement"></block>
            <block type="repeat_loop"></block>
            <block type="while_loop"></block>
            <block type="wait_delay"></block>
        </category>
        <category name="Akcje i Chat" colour="#4a90e2">
            <block type="send_message"></block>
            <block type="broadcast_msg"></block>
            <block type="send_pm"></block>
            <block type="send_actionbar"></block>
            <block type="console_log"></block>
        </category>
        <category name="Gracz i Świat" colour="#5cb85c">
            <block type="give_item"></block>
            <block type="remove_item"></block>
            <block type="clear_inventory"></block>
            <block type="teleport_player"></block>
            <block type="open_gui"></block>
            <block type="play_sound_custom"></block>
            <block type="command_dynamic_sound"></block>
            <block type="execute_command"></block>
            <block type="set_level"></block>
            <block type="add_level"></block>
            <block type="heal_player"></block>
            <block type="feed_player"></block>
            <block type="set_gamemode"></block>
            <block type="apply_potion"></block>
            <block type="spawn_lightning"></block>
            <block type="spawn_explosion"></block>
            <block type="kick_player"></block>
            <block type="ban_player"></block>
        </category>
        <category name="Zmienne i Math" colour="#f0ad4e">
            <block type="set_variable"></block>
            <block type="add_variable"></block>
            <block type="math_operation"></block>
            <block type="get_random_number"></block>
        </category>
    </xml>

    <script>
        // --- INICJALIZACJA BLOCKLY ---
        var workspace = Blockly.inject('blocklyDiv', {
            toolbox: document.getElementById('toolbox'),
            grid: { spacing: 20, length: 3, colour: '#333', snap: true },
            zoom: { controls: true, wheel: true }
        });

        // --- DEFINICJE KLOCKÓW ---

        Blockly.Blocks['on_event'] = {
            init: function() {
                this.jsonInit({
                    "message0": "Gdy zdarzenie: %1 %2",
                    "args0": [
                        {
                            "type": "field_dropdown",
                            "name": "EVENT_TYPE",
                            "options": [
                                ["Wejście gracza na serwer", "join"],
                                ["Wyjście gracza", "quit"],
                                ["Napisanie wiadomości na czacie", "chat"],
                                ["Śmierć gracza", "death"],
                                ["Odrodzenie gracza", "respawn"],
                                ["Podniesienie przedmiotu", "pickup"],
                                ["Wyrzucenie przedmiotu", "drop"]
                            ]
                        },
                        { "type": "input_statement", "name": "DO" }
                    ],
                    "colour": 300,
                    "tooltip": "Główny trigger zdarzenia serwerowego"
                });
            }
        };

        Blockly.Blocks['on_command'] = {
            init: function() {
                this.jsonInit({
                    "message0": "Gdy gracz wpisze komendę /%1 to %2",
                    "args0": [
                        { "type": "field_input", "name": "CMD", "text": "pomoc" },
                        { "type": "input_statement", "name": "DO" }
                    ],
                    "colour": 280,
                    "tooltip": "Tworzy nową komendę na serwerze"
                });
            }
        };

        Blockly.Blocks['do_action'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wykonaj czynność: %1 %2",
                    "args0": [
                        { "type": "field_input", "name": "ACTION_NAME", "text": "nazwa_czynnosci" },
                        { "type": "input_statement", "name": "DO" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 290,
                    "tooltip": "Grupuje i wykonuje zdefiniowany blok czynności"
                });
            }
        };

        Blockly.Blocks['if_then_action'] = {
            init: function() {
                this.jsonInit({
                    "message0": "jeśli %1 to zrób akcję %2 %3",
                    "args0": [
                        { "type": "field_input", "name": "CONDITION", "text": "gracz ma uprawnienia" },
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "DO" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 270,
                    "tooltip": "Wykonuje zestaw akcji po spełnieniu warunku"
                });
            }
        };

        Blockly.Blocks['if_else_action'] = {
            init: function() {
                this.jsonInit({
                    "message0": "jeśli %1 to: %2 %3 w przeciwnym razie: %4 %5",
                    "args0": [
                        { "type": "field_input", "name": "CONDITION", "text": "zmienna > 5" },
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "TRUE_DO" },
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "FALSE_DO" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 265,
                    "tooltip": "Instrukcja warunkowa z gałęzią Else"
                });
            }
        };

        Blockly.Blocks['wait_delay'] = {
            init: function() {
                this.jsonInit({
                    "message0": "po czasie %1 sekund wykonaj: %2 %3",
                    "args0": [
                        { "type": "field_number", "name": "SECONDS", "value": 3 },
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "DO" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 260,
                    "tooltip": "Czeka określoną liczbę sekund przed wykonaniem kolejnych klocków"
                });
            }
        };

        Blockly.Blocks['send_message'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wyślij jako %1 treść %2",
                    "args0": [
                        {
                            "type": "field_dropdown",
                            "name": "DISP_TYPE",
                            "options": [
                                ["Czat (Chat)", "chat"],
                                ["Tytuł na środku (Title)", "title"],
                                ["Menu boczne (Sidebar)", "sidebar"],
                                ["Pasek bossa (Bossbar)", "bossbar"]
                            ]
                        },
                        { "type": "field_input", "name": "MSG", "text": "Witaj na serwerze!" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 210,
                    "tooltip": "Wysyła wiadomość do gracza w wybranym formacie"
                });
            }
        };

        Blockly.Blocks['send_pm'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wyślij prywatną wiadomość do %1 o treści %2",
                    "args0": [
                        { "type": "field_input", "name": "TARGET", "text": "Gracz" },
                        { "type": "field_input", "name": "MSG", "text": "Siemanko!" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 200,
                    "tooltip": "Wysyła wiadomość szeptem / PM"
                });
            }
        };

        Blockly.Blocks['send_actionbar'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wyślij na pasek akcji (Actionbar) %1",
                    "args0": [{ "type": "field_input", "name": "MSG", "text": "Status: OK" }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 205,
                    "tooltip": "Wyświetla tekst nad ekwipunkiem gracza"
                });
            }
        };

        Blockly.Blocks['broadcast_msg'] = {
            init: function() {
                this.jsonInit({
                    "message0": "ogłoś wszystkim %1",
                    "args0": [{ "type": "field_input", "name": "MSG", "text": "Uwaga wszyscy!" }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 220,
                    "tooltip": "Wysyła wiadomość do wszystkich graczy"
                });
            }
        };

        Blockly.Blocks['console_log'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wypisz w konsoli %1",
                    "args0": [{ "type": "field_input", "name": "TEXT", "text": "Log systemowy" }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 180,
                    "tooltip": "Wpisuje tekst do konsoli serwera"
                });
            }
        };

        Blockly.Blocks['give_item'] = {
            init: function() {
                this.jsonInit({
                    "message0": "daj graczowi przedmiot %1 w ilości %2",
                    "args0": [
                        { "type": "field_input", "name": "ITEM", "text": "diamond" },
                        { "type": "field_number", "name": "AMOUNT", "value": 1 }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 120,
                    "tooltip": "Daje przedmiot do ekwipunku gracza"
                });
            }
        };

        Blockly.Blocks['remove_item'] = {
            init: function() {
                this.jsonInit({
                    "message0": "zabierz graczowi przedmiot %1 w ilości %2",
                    "args0": [
                        { "type": "field_input", "name": "ITEM", "text": "dirt" },
                        { "type": "field_number", "name": "AMOUNT", "value": 1 }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 122,
                    "tooltip": "Usuwa przedmiot z ekwipunku gracza"
                });
            }
        };

        Blockly.Blocks['clear_inventory'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wyczyść ekwipunek gracza",
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 124,
                    "tooltip": "Usuwa wszystko z ekwipunku gracza"
                });
            }
        };

        Blockly.Blocks['open_gui'] = {
            init: function() {
                this.jsonInit({
                    "message0": "otwórz graczowi menu GUI o tytule %1 z rzędami %2 %3",
                    "args0": [
                        { "type": "field_input", "name": "GUITITLE", "text": "Sklep Serwera" },
                        { "type": "field_number", "name": "ROWS", "value": 3 },
                        { "type": "input_statement", "name": "DO" }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 125,
                    "tooltip": "Otwiera interaktywne menu GUI z przedmiotami"
                });
            }
        };

        Blockly.Blocks['teleport_player'] = {
            init: function() {
                this.jsonInit({
                    "message0": "teleportuj gracza na X: %1 Y: %2 Z: %3",
                    "args0": [
                        { "type": "field_number", "name": "X", "value": 0 },
                        { "type": "field_number", "name": "Y", "value": 100 },
                        { "type": "field_number", "name": "Z", "value": 0 }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 140,
                    "tooltip": "Teleportuje gracza w wybrane miejsce"
                });
            }
        };

        Blockly.Blocks['play_sound_custom'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("odtwórz dźwięk")
                    .appendField(new Blockly.FieldDropdown([
                        ["Poziom w górę (Levelup)", "entity.player.levelup"],
                        ["Wybuch (Explode)", "entity.generic.explode"],
                        ["Piorun (Lightning)", "entity.lightning_bolt.impact"],
                        ["Strzała (Bow)", "entity.arrow.shoot"],
                        ["Kliknięcie (Click)", "block.stone_button.click_on"],
                        ["Totem (Totem)", "item.totem.use"],
                        ["Mikstura (Drink)", "entity.generic.drink"],
                        ["Uderzenie (Hit)", "entity.player.attack.strong"],
                        ["Dzwonek (Bell)", "block.bell.use"]
                    ]), "SOUND")
                    .appendField("graczowi");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(160);
                this.tooltip = "Odtwarza efekt dźwiękowy z listy";
            }
        };

        Blockly.Blocks['command_dynamic_sound'] = {
            init: function() {
                this.jsonInit({
                    "message0": "stwórz komendę /dzwiek [wpisz w grze nazwa dźwięku]",
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 165,
                    "tooltip": "Tworzy komendę /dzwiek <dźwięk>"
                });
            }
        };

        Blockly.Blocks['execute_command'] = {
            init: function() {
                this.jsonInit({
                    "message0": "wykonaj komendę w grze /%1",
                    "args0": [{ "type": "field_input", "name": "CMD", "text": "heal" }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 175,
                    "tooltip": "Wykonuje komendę z uprawnieniami serwera"
                });
            }
        };

        Blockly.Blocks['set_level'] = {
            init: function() {
                this.jsonInit({
                    "message0": "ustaw poziom doświadczenia gracza na %1",
                    "args0": [{ "type": "field_number", "name": "LEVEL", "value": 30 }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 130,
                    "tooltip": "Zmienia poziom XP gracza"
                });
            }
        };

        Blockly.Blocks['add_level'] = {
            init: function() {
                this.jsonInit({
                    "message0": "dodaj do poziomu doświadczenia gracza %1",
                    "args0": [{ "type": "field_number", "name": "LEVEL", "value": 5 }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 132,
                    "tooltip": "Dodaje poziomy XP"
                });
            }
        };

        Blockly.Blocks['heal_player'] = {
            init: function() {
                this.jsonInit({
                    "message0": "uzdrów gracza (pełne zdrowie)",
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 135,
                    "tooltip": "Regeneruje życie gracza do max"
                });
            }
        };

        Blockly.Blocks['feed_player'] = {
            init: function() {
                this.jsonInit({
                    "message0": "nakarm gracza (pełny głód)",
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 137,
                    "tooltip": "Uzupełnia pasek głodu"
                });
            }
        };

        Blockly.Blocks['set_gamemode'] = {
            init: function() {
                this.jsonInit({
                    "message0": "zmień tryb gry gracza na %1",
                    "args0": [{
                        "type": "field_dropdown",
                        "name": "MODE",
                        "options": [
                            ["Przetrwanie (Survival)", "survival"],
                            ["Kreatywny (Creative)", "creative"],
                            ["Przygoda (Adventure)", "adventure"],
                            ["Obserwator (Spectator)", "spectator"]
                        ]
                    }],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 145,
                    "tooltip": "Zmienia tryb gry (Gamemode)"
                });
            }
        };

        Blockly.Blocks['apply_potion'] = {
            init: function() {
                this.jsonInit({
                    "message0": "nałóż efekt %1 na %2 sekund (siła: %3)",
                    "args0": [
                        { "type": "field_input", "name": "POTION", "text": "speed" },
                        { "type": "field_number", "name": "TIME", "value": 30 },
                        { "type": "field_number", "name": "AMP", "value": 1 }
                    ],
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 150,
                    "tooltip": "Nakłada efekt mikstury"
                });
            }
        };

        Blockly.Blocks['spawn_lightning'] = {
            init: function() {
                this.jsonInit({
                    "message0": "uważaj: uderz piorunem w gracza",
                    "previousStatement": null,
                    "nextStatement": null,
                    "colour": 155,
                    "tooltip": "Uderza piorunem w pozycję gracza"
                });
            }
        };

        Blockly.Blocks['spawn_explosion'] = {
            init: function() {

        // --- GENERATOR KODU ---
        const generator = javascript.javascriptGenerator;

        function getStatements(block, statementName) {
            let format = document.getElementById('formatSelect').value;
            let statementsCode = generator.statementToCode(block, statementName);
            if (!statementsCode.trim()) {
                if (format === 'js') return '    // brak akcji\n';
                if (format === 'python') return '    pass\n';
                if (format === 'html') return '        <!-- brak akcji -->\n';
                if (format === 'commands') return '    # brak komend wewnątrz\n';
                return '    # brak akcji\n';
            }
            if (format === 'skript') {
                return statementsCode.split('\n').map(line => line ? '        ' + line.trim() : '').join('\n');
            }
            return statementsCode;
        }

        generator.forBlock['on_event'] = function(block) {
            let format = document.getElementById('formatSelect').value;
            let eventType = block.getFieldValue('EVENT_TYPE');
            let inner = getStatements(block, 'DO');

            if (format === 'skript') {
                let map = { join: 'on join:', quit: 'on quit:', chat: 'on chat:', death: 'on death:', respawn: 'on respawn:', pickup: 'on pickup:', drop: 'on drop:' };
                return `${map[eventType]}\n${inner}`;
            } else if (format === 'js') {
                let map = { join: 'server.on("playerJoin", (player) => {', quit: 'server.on("playerQuit", (player) => {', chat: 'server.on("playerChat", (player, message) => {', death: 'server.on("playerDeath", (player) => {', respawn: 'server.on("playerRespawn", (player) => {', pickup: 'server.on("playerPickup", (player, item) => {', drop: 'server.on("playerDrop", (player, item) => {' };
                return `${map[eventType]}\n${inner}});\n\n`;
            } else if (format === 'python') {
                let map = { join: 'def on_player_join(player):', quit: 'def on_player_quit(player):', chat: 'def on_player_chat(player, message):', death: 'def on_player_death(player):', respawn: 'def on_player_respawn(player):', pickup: 'def on_player_pickup(player, item):', drop: 'def on_player_drop(player, item):' };
                return `${map[eventType]}\n${inner}\n`;
            } else if (format === 'html') {
                return `<div data-event="${eventType}">\n${inner}</div>\n`;
            } else if (format === 'commands') {
                return `# Zdarzenie: ${eventType}\n${inner}`;
            }
            return '';
        };

        generator.forBlock['on_command'] = function(block) {
            let format = document.getElementById('formatSelect').value;
            let cmd = block.getFieldValue('CMD');
            let inner = getStatements(block, 'DO');

            if (format === 'skript') return `command /${cmd}:\n    trigger:\n${inner}`;
            if (format === 'js') return `server.command("${cmd}", (player, args) => {\n${inner}});\n\n`;
            if (format === 'python') return `@server.command("${cmd}")\ndef cmd_${cmd}(player, args):\n${inner}\n`;
            if (format === 'html') return `<div data-command="${cmd}">\n${inner}</div>\n`;
            if (format === 'commands') return `# Komenda /${cmd}\n${inner}`;
            return '';
        };

        generator.forBlock['do_action'] = function(block) {
            let format = document.getElementById('formatSelect').value;
            let actionName = block.getFieldValue('ACTION_NAME');
            let inner = getStatements(block, 'DO');

            if (format === 'skript') return `function ${actionName}():\n${inner}`;
            if (format === 'js') return `function ${actionName}() {\n${inner}}\n`;
            if (format === 'python') return `def ${actionName}():\n${inner}\n`;
            if (format === 'html') return `<div id="action-${actionName}">\n${inner}</div>\n`;
            if (format === 'commands') return `# Czynność: ${actionName}\n${inner}`;
            return '';
        };

        generator.forBlock['if_then_action'] = function(block) {
            let format = document.getElementById('formatSelect').value;
            let cond = block.getFieldValue('CONDITION');
            let inner = getStatements(block, 'DO');

            if (format === 'skript') return `    if ${cond}:\n${inner}`;
            if (format === 'js') return `    if (${cond}) {\n${inner}    }\n`;
            if (format === 'python') return `    if ${cond}:\n${inner}`;
            if (format === 'html') return `    <!-- if ${cond} -->\n${inner}`;
            if (format === 'commands') return `    execute if ${cond} run ...\n`;
            return '';
        };

        generator.forBlock['if_else_action'] = function(block) {
            let format = document.getElementById('formatSelect').value;
            let cond = block.getFieldValue('CONDITION');
            let trueDo = getStatements(block, 'TRUE_DO');
            let falseDo = getStatements(block, 'FALSE_DO');

            if (format === 'skript') return `    if ${cond}:\n${trueDo}    else:\n${falseDo}`;
            if (format === 'js') return `    if (${cond}) {\n${trueDo}    } else {\n${falseDo}    }\n`;
            if (format === 'python') return `    if ${cond}:\n${trueDo}    else:\n${falseDo}`;
            return `    if/else (${cond})\n`;
        };

            if (format === 'js') return `    setTimeout(() => {\n${inner}    }, ${seconds * 1000});\n`;
            if (format === 'python') return `    time.sleep(${seconds})\n${inner}`;
            if (format === 'html') return `    <!-- wait ${seconds}s -->\n${inner}`;
            if (format === 'commands') return `    # schedule function ... ${seconds}s\n`;

            } else if (format === 'python') {
                return `    gui = server.create_gui("${title}", ${rows * 9})\n${inner}\n    player.open_gui(gui)\n`;
            } else if (format === 'html') {
                return `    <div class="gui-menu" data-title="${title}" data-rows="${rows}">\n${inner}    </div>\n`;

        // --- FUNKCJE INTERFEJSU I EDYTORA GUI ---
        function updateCode() {
            let code = generator.workspaceToCode(workspace);
            let format = document.getElementById('formatSelect').value;
            let headerComment = `# Wygenerowano automatycznie dla formatu: ${format.toUpperCase()}\n\n`;

            let textarea = document.getElementById('outputCode');
            textarea.select();
            document.execCommand('copy');
            alert('Skopiowano wygenerowany kod do schowka!');
        }

        function openGuiModal() {
            document.getElementById('guiModal').style.display = 'flex';
            updateGuiGridSize();
        }

        function closeGuiModal() {
            document.getElementById('guiModal').style.display = 'none';
        }

        function updateGuiGridSize() {
            let rows = parseInt(document.getElementById('guiRowsSelect').value);
            let container = document.getElementById('guiGridContainer');
            container.innerHTML = '';
            let totalSlots = rows * 9;
            container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for (let i = 0; i < totalSlots; i++) {
                let slot = document.createElement('div');
                slot.className = 'gui-slot';
                slot.innerHTML = `${i}<input type="text" placeholder="item" oninput="updateSlotLabel(this, ${i})">`;
                container.appendChild(slot);
            }
        }

        function updateSlotLabel(input, index) {
            let slot = input.parentElement;
            if (input.value.trim() !== '') {
                slot.style.background = '#0e639c';
                slot.style.color = '#fff';
                slot.title = input.value;
            } else {
                slot.style.background = '#2d2d2d';
                slot.style.color = '#888';
                slot.title = '';
            }
        }

        function saveGuiConfig() {
            let title = document.getElementById('guiTitleInput').value;
            let rows = document.getElementById('guiRowsSelect').value;
            alert(`Zapisano konfigurację GUI "${title}" (${rows} rzędów)! Możesz teraz wstawić klocek otwierania GUI.`);
            closeGuiModal();
        }
